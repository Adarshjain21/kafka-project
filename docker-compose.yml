version: "2"
services:
  zookeeper:
    image: zookeeper
    ports:
      - "2181:2181"
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    links:
      - zookeeper
    environment:
      # Two listeners:
      #   PLAINTEXT_HOST → published to the Docker host as localhost:9092
      #     (Node apps running on your machine use this)
      #   PLAINTEXT      → used inside the Docker network as kafka:29092
      #     (kafka-ui and any other container uses this)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Disable auto-create: topics must come from admin.js (with correct
      # partition count), never from a stray producer/consumer connect.
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 2
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      # Auto-register the local cluster so you don't have to fill the form by hand
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Redis — hot path for dedup, rider state, latest-N feed, rate limit, pub/sub.
  # AOF (appendonly) gives durability on crash; snapshot (RDB) stays on for
  # fast cold-start restore. maxmemory + allkeys-lru keeps the hot set bounded
  # even if a consumer bug would otherwise grow a key forever.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Browser UI for Redis — inspect keys, run commands, watch pub/sub channels.
  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis-data:
